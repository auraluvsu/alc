name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage, if-no-files-found: ignore }

  build:
    name: Build and verify prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run verify:build
      - run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 3 }

  e2e:
    name: End-to-end (Chromium)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx playwright install chromium
      # System libraries come from apt, whose mirrors are occasionally unreachable from the runner.
      # ubuntu-latest already ships most of them, so retry a few times and carry on if apt stays down.
      - name: Install Chromium system dependencies (best effort)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "apt attempt $i failed; retrying in 15s"; sleep 15
          done
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: 'playwright-report', retention-days: 7, if-no-files-found: ignore }
